name: Passport Ranking CI/CD

on:

  # Deploy automatically to DEV
  push:
    branches:
      - dev
      - main

  # Validate code when creating PR to main
  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # CI - Validate repository
  # ==========================================================

  validate:
    name: Validate SQL
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List SQL files
        run: |
          set -euo pipefail
          SQL_DIRS=(scripts tables views procedures tasks)

          echo "SQL files in repository:"
          for dir in "${SQL_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Expected SQL directory not found: $dir"
              exit 1
            fi
          done

          find "${SQL_DIRS[@]}" -type f -name "*.sql" | sort

      - name: Check SQL files exist
        run: |
          set -euo pipefail
          SQL_DIRS=(scripts tables views procedures tasks)

          for dir in "${SQL_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Expected SQL directory not found: $dir"
              exit 1
            fi
          done

          if [ -z "$(find "${SQL_DIRS[@]}" -type f -name '*.sql' -print -quit)" ]; then
            echo "No SQL files found in expected SQL directories: ${SQL_DIRS[*]}"
            exit 1
          fi

          echo "SQL validation passed"

      - name: Check for hardcoded credentials
        run: |
          SQL_DIRS=(scripts tables views procedures tasks)

          if grep -RniE \
            "password\s*=|private_key\s*=|secret_key\s*=|access_key\s*=" \
            "${SQL_DIRS[@]}" .github \
            --include="*.sql" \
            --include="*.yml" \
            --include="*.yaml"; then

            echo "Possible credential detected"
            exit 1
          fi

          echo "Credential check passed"

      - name: Validate task block delimiters
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          invalid = []
          pattern = re.compile(r'CREATE\s+OR\s+REPLACE\s+TASK[\s\S]*?\bAS\s+BEGIN\b', re.IGNORECASE)

          for path in sorted(pathlib.Path("tasks").glob("*.sql")):
              content = path.read_text(encoding="utf-8")
              if pattern.search(content):
                  invalid.append(str(path))

          if invalid:
              print("Task files using `AS BEGIN` blocks must wrap bodies for file execution (for example EXECUTE IMMEDIATE $$ ... $$):")
              for file in invalid:
                  print(f" - {file}")
              sys.exit(1)

          print("Task delimiter validation passed")
          PY


  # ==========================================================
  # DEV DEPLOYMENT
  # ==========================================================

  deploy-dev:
    name: Deploy to DEV

    needs: validate

    if: github.event_name == 'push' &&
        github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3

      - name: Show runner public IP
  run: |
    ip=$(curl --fail --silent --show

      - name: Test Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
        run: |
          snow connection test -x

      - name: Deploy SQL to DEV
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: SHPROD
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          set -euo pipefail
          SQL_DIRS=(scripts tables views procedures tasks)

          for dir in "${SQL_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Expected SQL directory not found: $dir"
              exit 1
            fi
          done

          for dir in "${SQL_DIRS[@]}"; do
            while IFS= read -r file; do
              echo "========================================"
              echo "Deploying: $file"
              echo "========================================"

              deploy_file="$(mktemp)"
              {
                echo "USE DATABASE SHPROD;"
                echo "USE SCHEMA PUBLIC;"
                cat "$file"
              } > "$deploy_file"

              snow sql \
                -x \
                -f "$deploy_file"

              rm -f "$deploy_file"
            done < <(find "$dir" -type f -name "*.sql" | sort)
          done


  # ==========================================================
  # PROD DEPLOYMENT
  # ==========================================================

  deploy-prod:
    name: Deploy to PROD

    needs: validate

    if: github.event_name == 'push' &&
        github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: PROD

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3

      - name: Test Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
        run: |
          snow connection test -x

      - name: Deploy SQL to PROD
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: SHPROD
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          set -euo pipefail
          SQL_DIRS=(scripts tables views procedures tasks)

          for dir in "${SQL_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Expected SQL directory not found: $dir"
              exit 1
            fi
          done

          for dir in "${SQL_DIRS[@]}"; do
            while IFS= read -r file; do
              echo "========================================"
              echo "Deploying: $file"
              echo "========================================"

              deploy_file="$(mktemp)"
              {
                echo "USE DATABASE SHPROD;"
                echo "USE SCHEMA PUBLIC;"
                cat "$file"
              } > "$deploy_file"

              snow sql \
                -x \
                -f "$deploy_file"

              rm -f "$deploy_file"
            done < <(find "$dir" -type f -name "*.sql" | sort)
          done
